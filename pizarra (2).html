<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Seguridad: la página solo puede hablar con Google (planilla o Apps Script) y cargar la tipografía. Nada más. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data:; connect-src https://docs.google.com https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Pizarra Juventud Providencia B</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  /* Idea: lienzo fijo 1920×1080 (16:9) escalado al televisor; ocho columnas, cada opción es un círculo con confeti y su nombre arriba. */
  :root {
    --wall: #F3ECE1;
    --ink: #2B2420;
    --muted: #5B5147;
    --line: #D9CDB8;
    --panel: #FFFDF8;
    --font: "Raleway", "Segoe UI", system-ui, sans-serif;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body { -webkit-user-select: none; user-select: none; }
  input { -webkit-user-select: text; user-select: text; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { background: var(--wall); color: var(--ink); font-family: var(--font); font-variant-numeric: lining-nums; font-size: 20px; line-height: 1.3; }
  .stage {
    position: absolute; left: 50%; top: 50%;
    width: 1920px; height: 1080px;
    transform: translate(-50%, -50%) scale(var(--fit, 1));
    padding: 40px 48px 28px;
    display: grid; grid-template-rows: auto 1fr auto; gap: 22px;
  }
  header { display: grid; grid-template-columns: 1fr auto 1fr; gap: 24px; align-items: center; min-height: 72px; }
  .h-left { display: flex; align-items: center; }
  .h-center { text-align: center; display: flex; flex-direction: column; gap: 10px; }
  .lede { margin: 0; font-size: 22px; font-weight: 500; line-height: 1.4; color: var(--muted); }
  .start { position: absolute; left: 44px; top: 168px; pointer-events: none; transition: opacity 300ms var(--ease-out); animation: nudge 1.1s ease-in-out infinite alternate; }
  .start span {
    position: relative; display: inline-block; padding: 9px 22px; border-radius: 999px;
    background: #ED1E79; color: #fff; font-weight: 800; font-size: 24px; line-height: 1.1;
    box-shadow: 0 6px 14px rgba(237, 30, 121, 0.3);
  }
  .start span::after {   /* puntita que apunta a la pregunta */
    content: ""; position: absolute; left: 34px; bottom: -13px;
    border-left: 12px solid transparent; border-right: 12px solid transparent; border-top: 14px solid #ED1E79;
  }
  .start.off { opacity: 0; }
  @keyframes nudge { from { transform: translateY(0); } to { transform: translateY(7px); } }
  .group-head { grid-column: 3 / 9; grid-row: 1; display: flex; align-items: center; gap: 14px; font-weight: 800; font-size: 26px; margin-bottom: -4px; }
  .group-head::after { content: ""; flex: 1; height: 3px; background: var(--ink); border-radius: 2px; }
  h1 { font-weight: 800; font-size: 64px; line-height: 1; margin: 0; }
  .me { display: flex; gap: 16px; align-items: center; justify-content: flex-end; font-size: 19px; text-align: right; }
  .me-color { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; }
  .chip { width: 26px; height: 26px; border-radius: 50%; background: var(--c); flex: none; }
  .hint { color: var(--muted); font-weight: 500; }

  .board { display: grid; grid-template-columns: 170px 186px repeat(6, 1fr) 196px 1.2fr; grid-template-rows: auto 1fr; gap: 8px 14px; min-height: 0; }
  .col { grid-row: 2; display: flex; flex-direction: column; min-height: 0; border-top: 2px solid var(--line); padding-top: 12px; transition: opacity 400ms var(--ease-out); }
  .col h2 { font-weight: 800; font-size: 21px; line-height: 1.12; margin: 0; min-height: 84px; text-wrap: balance; }
  .tally { margin: -4px 0 8px; font-size: 15px; font-weight: 500; color: var(--muted); }
  .tally b { font-size: 20px; font-weight: 800; color: var(--ink); font-variant-numeric: tabular-nums lining-nums; }
  .opts { flex: 1; display: flex; flex-direction: column; justify-content: space-around; align-items: center; min-height: 0; }

  .opt {
    font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
  }
  .opt-label { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 20px; line-height: 1; text-align: center; justify-content: center; flex-wrap: wrap; }
  .opt-label .chip { width: 20px; height: 20px; }
  .opt-count { color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums lining-nums; }
  .opt canvas {
    width: var(--s); height: var(--s); display: block; border-radius: 50%;
    animation: bob 3.2s ease-in-out infinite alternate;
    transition: box-shadow 160ms ease;
  }
  .opt[aria-pressed="true"] canvas { box-shadow: 0 0 0 5px var(--ring, var(--ink)); }
  .opt.inf canvas { width: 230px; height: 518px; border-radius: 0; animation: none; box-shadow: none; }
  .mark { width: 158px; height: 72px; flex: none; }
  .brand { display: flex; align-items: center; gap: 22px; }
  .opt:focus-visible { outline: 4px solid #3a57e8; outline-offset: 4px; border-radius: 12px; }
  @keyframes bob { from { transform: translateY(8px); } to { transform: translateY(-8px); } }
  /* Cuando un contador sube, late y se pinta de rosado un momento: así se nota cada respuesta nueva */
  @keyframes pulse { 0% { transform: scale(1); } 30% { transform: scale(1.7); color: #E01A72; } 100% { transform: scale(1); } }
  .opt-count.pulse, .tally b.pulse { display: inline-block; animation: pulse 1.6s var(--ease-out); }

  .stackbtn { flex: 1; min-height: 0; position: relative; width: 100%; padding: 0; border: 0; background: none; cursor: pointer; border-radius: 12px; }
  .stackbtn canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .stackbtn:focus-visible { outline: 4px solid #3a57e8; outline-offset: 4px; }
  .postits { flex: 1; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .notes { flex: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; align-content: start; min-height: 0; overflow: hidden; padding: 4px; }
  .note {
    aspect-ratio: 1; padding: 5px; overflow: hidden;
    font-size: 12.5px; font-weight: 700; line-height: 1.12; overflow-wrap: anywhere; hyphens: auto;
    box-shadow: 0 3px 6px rgba(43, 36, 32, 0.22);
    transform: rotate(var(--rot, 0deg));
  }
  .notes.bulbs { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 14px; padding: 4px 10px; }
  .bulb { position: relative; display: flex; flex-direction: column; align-items: center; transform: rotate(var(--rot, 0deg));
    font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  .bulb:focus-visible { outline: 4px solid #3a57e8; outline-offset: 3px; border-radius: 12px; }
  .bulb .votes {
    position: absolute; top: -4px; right: -6px; min-width: 30px; height: 30px; padding: 0 7px; border-radius: 999px;
    display: flex; align-items: center; justify-content: center;
    background: var(--panel); border: 2px solid var(--ink); font-weight: 800; font-size: 15px; font-variant-numeric: tabular-nums lining-nums;
  }
  .bulb.voted .votes { background: var(--ink); color: #fff; }
  .bulb .votes.bump { animation: bump 320ms var(--ease-out); }
  @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.35); } 100% { transform: scale(1); } }
  .btn.more { padding: 8px 10px; font-size: 16px; white-space: normal; line-height: 1.15; }
  .panel {
    position: absolute; inset: 28px 40px; z-index: 20; background: var(--wall); border: 3px solid var(--ink); border-radius: 24px;
    box-shadow: 0 30px 80px rgba(43, 36, 32, 0.35); padding: 28px 36px; display: flex; flex-direction: column; gap: 20px;
    animation: panelIn 260ms var(--ease-out);
  }
  .panel[hidden] { display: none; }
  @keyframes panelIn { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }
  .panel-head { display: flex; gap: 28px; align-items: flex-end; }
  .panel-head > div { flex: 1; }
  .panel-head h2 { margin: 0; font-weight: 800; font-size: 48px; line-height: 1.05; }
  .panel-head .hint { margin: 6px 0 0; font-size: 21px; }
  .panel-form { display: flex; gap: 10px; align-items: center; }
  .panel-form .hint { white-space: nowrap; font-size: 18px; }
  .panel-form input { font: inherit; font-size: 20px; font-weight: 500; padding: 10px 14px; border: 3px solid var(--ink); border-radius: 12px; background: var(--panel); color: var(--ink); width: 300px; }
  .panel-form input:focus-visible { outline: 4px solid #3a57e8; outline-offset: 2px; }
  .panel-grid { flex: 1; min-height: 0; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 26px 22px; align-content: start; padding: 12px 8px; }
  .panel-grid .bulb .glass { font-size: 16px; padding: 12px; }
  @media (prefers-reduced-motion: reduce) { .panel, .bulb .votes.bump { animation: none; } }
  .bulb .glass {
    width: 100%; aspect-ratio: 1; padding: 7px; overflow: hidden;
    border-radius: 50% 50% 46% 46% / 46% 46% 54% 54%;
    display: flex; align-items: center; justify-content: center; text-align: center;
    font-size: 13px; font-weight: 700; line-height: 1.1; hyphens: auto; overflow-wrap: anywhere;
    box-shadow: inset -5px -6px 0 rgba(43, 36, 32, 0.13), inset 5px 5px 0 rgba(255, 255, 255, 0.35), 0 0 14px rgba(255, 204, 51, 0.55);
  }
  .bulb .cap { width: 36%; height: 13px; margin-top: -3px; border-radius: 0 0 6px 6px; background: repeating-linear-gradient(#8A8178 0 3px, #5B5147 3px 5px); }
  .note.new, .bulb.new { animation: stick 240ms var(--ease-out); }
  @keyframes stick { from { opacity: 0; transform: rotate(var(--rot, 0deg)) scale(0.92); } to { opacity: 1; transform: rotate(var(--rot, 0deg)) scale(1); } }
  .note-form { display: flex; flex-direction: column; gap: 6px; }
  .note-form input { font: inherit; font-size: 17px; font-weight: 500; padding: 9px 12px; border: 3px solid var(--ink); border-radius: 12px; background: var(--panel); color: var(--ink); width: 100%; }
  .note-form input:focus-visible { outline: 4px solid #3a57e8; outline-offset: 2px; }
  .note-form .btn { padding: 8px 10px; font-size: 17px; }
  .note-form .hint { font-size: 17px; }

  .btn {
    font: inherit; font-weight: 700; color: var(--ink); cursor: pointer; white-space: nowrap;
    background: var(--panel); border: 3px solid var(--ink); border-radius: 999px; padding: 12px 26px;
    transition: transform 140ms var(--ease-out);
  }
  .btn:active { transform: scale(0.97); }
  .btn.primary { background: var(--ink); color: #fff; }
  .btn.quiet { border: 2px solid var(--line); color: var(--muted); font-weight: 500; padding: 8px 16px; font-size: 18px; }
  .btn:focus-visible { outline: 4px solid #3a57e8; outline-offset: 3px; }
  footer { display: flex; gap: 14px; align-items: center; border-top: 2px solid var(--line); padding-top: 12px; color: var(--muted); font-size: 18px; font-weight: 500; }
  footer p { margin: 0; flex: 1; }

  /* Modo en vivo: la gente responde desde el celular; en la pantalla solo se mira */
  .live .start, .live .note-form, .live .panel-form, .live #demo, .live #reset { display: none; }
  .live .bulb { cursor: default; }

  @media (prefers-reduced-motion: reduce) {
    .opt-count.pulse, .tally b.pulse { animation: none; }
    .start { animation: none; }
    .opt canvas { animation-duration: 8s; }
  }
</style>
</head>
<body>
<main class="stage" id="stage">
  <header>
    <div class="h-left"></div>
    <div class="h-center">
      <h1>Queremos conocerte</h1>
      <p class="lede">Somos la Oficina de la Juventud de Providencia. Cuéntanos quién eres y qué te interesa.<br>Diseñemos juntos espacios para ti.</p>
    </div>
    <div class="me" id="me" aria-live="polite"></div>
  </header>
  <div class="start" id="start" aria-hidden="true"><span>¡Comienza aquí!</span></div>
  <div class="board locked" id="board"></div>
  <footer>
    <p id="status">Las respuestas se guardan solo en este dispositivo.</p>
    <button class="btn quiet" id="demo" type="button">Ver datos del formulario</button>
    <button class="btn quiet" id="full" type="button">Pantalla completa</button>
    <button class="btn quiet" id="copy" type="button">Copiar resultados</button>
    <button class="btn quiet" id="reset" type="button">Borrar todo</button>
  </footer>
</main>

<script>
(function () {
  var AGES = [
    { label: '15–17', txt: '15–17 años', color: '#F7931E', name: 'naranjo' },
    { label: '18–21', txt: '18–21 años', color: '#E01A72', name: 'rosado' },
    { label: '22–25', txt: '22–25 años', color: '#8BB844', name: 'verde' },
    { label: '26–29', txt: '26–29 años', color: '#3E96B4', name: 'azul' },
    { label: '30 o más', txt: '30 años o más', color: '#662D91', name: 'morado' }
  ];
  // Texto sobre cada color: el que tenga más contraste (mínimo 4,5:1, WCAG 1.4.3).
  function lum(h) { var c = [1, 3, 5].map(function (i) { var v = parseInt(h.substr(i, 2), 16) / 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }); return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]; }
  function inkOn(bg) { var l = lum(bg); return (l + 0.05) / (lum('#2B2420') + 0.05) >= 1.05 / (l + 0.05) ? '#2B2420' : '#fff'; }
  AGES.forEach(function (a) { a.fg = inkOn(a.color); });
  var AGE_IX = AGES.map(function (a, i) { return i; });
  function zeros() { return AGES.map(function () { return 0; }); }
  // Columnas después de la edad. Una opción sin nombre usa el título de la columna.
  var GROUPS = [
    { title: '¿Cuál es tu vínculo con Provi?', color: '#03C2AE', size: 164, options: [['vivo', 'Vives'], ['estudio', 'Estudias'], ['trabajo', 'Trabajas']] },
    { title: 'Salud mental y bienestar', stack: true, options: [['salud', '']] },
    { title: 'Voluntariado y participación juvenil', stack: true, options: [['voluntariado', '']] },
    { title: 'Espacios de recreación', stack: true, options: [['recreacion', '']] },
    { title: 'Educación y formación', stack: true, options: [['educacion', '']] },
    { title: 'Herramientas para la vida independiente', stack: true, options: [['independiente', '']] },
    { title: 'Medio ambiente', stack: true, options: [['ambiente', '']] },
    { title: '¿Cómo te contactamos?', color: '#662D91', size: 104, options: [['whatsapp', 'WhatsApp'], ['correo', 'Correo electrónico'], ['instagram', 'Instagram'], ['llamada', 'Llamada telefónica']] },
    { title: 'Compártenos tu idea', color: '#3B6AF4', noteKey: 'recomendaciones', ask: 'Escribe tu idea' }
  ];
  var KEYS = [];
  GROUPS.forEach(function (g) { (g.options || []).forEach(function (o) { KEYS.push(o[0]); }); });
  var NOTE_KEYS = GROUPS.filter(function (g) { return g.noteKey; }).map(function (g) { return g.noteKey; });
  var STORE = 'pizarra-juventud-b-v1';
  /* ---------- Conexión con la planilla (modo en vivo) ----------
     Si pones la dirección de la planilla en csv, la pizarra deja de guardar en este dispositivo y se arma sola
     con lo que la gente responde en el celular (celular.html). Se actualiza cada `every` milisegundos.
     Lo recomendado: la dirección /exec de la aplicación web de Apps Script (apps-script/Codigo.gs). Entrega solo el
     resumen, sin números de nadie, y la planilla queda privada.
     Alternativa menos privada: el CSV de la hoja de respuestas, por ejemplo
       https://docs.google.com/spreadsheets/d/ID_DE_LA_PLANILLA/gviz/tq?tqx=out:csv&sheet=Respuestas%20de%20formulario%201
     (la planilla debe estar como «Cualquier persona con el enlace: lector») o el enlace de «Publicar en la web > CSV».
     También se puede pasar en la dirección de la pantalla: pizarra.html?csv=ENLACE
     Sin dirección, la pizarra funciona sola como antes (datos de ejemplo y toques en esta pantalla). */
  // base: true muestra, debajo de lo que llega en vivo, los datos de la encuesta anterior (unas 590 personas, sin números de persona).
  // Para el evento normalmente va en false: la pantalla parte vacía y solo muestra lo que se responde esa noche.
  var LIVE = { csv: 'https://script.google.com/macros/s/AKfycbzfUGbIhXSclsD40bGWJd-UrzIoZb6RrtwGxaZo9YyqdKijG7Mlsml5lK2WO2G4MY1M/exec', every: 5000, base: false };
  try { LIVE.csv = LIVE.csv || new URLSearchParams(location.search).get('csv') || ''; } catch (e) {}
  var IS_LIVE = !!LIVE.csv;
  if (IS_LIVE) document.body.classList.add('live');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function rng(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function emptyState() {
    var st = { ages: zeros(), links: {}, notes: {} };
    KEYS.forEach(function (k) { st.links[k] = []; });
    NOTE_KEYS.forEach(function (k) { st.notes[k] = []; });
    return st;
  }
  // Preguntas 1 y 2: respuestas reales del formulario "¿Cuál es tu relación con Providencia?"
  // (edad calculada como 2026 menos el año de nacimiento; 1 persona de 30 años queda fuera de los rangos).
  var FORM = {"ages": [311, 178, 47, 56], "links": {"vivo": [65, 47, 17, 17], "estudio": [292, 159, 19, 12], "trabajo": [2, 7, 15, 31],
    // Temas de interés: segundo formulario, solo quienes tienen entre 15 y 29 años (edad exacta al 17-11-2026).
    "salud": [11, 21, 43, 37], "voluntariado": [15, 21, 34, 24], "recreacion": [8, 21, 32, 31],
    "educacion": [7, 17, 26, 34], "independiente": [9, 18, 24, 22], "ambiente": [7, 15, 25, 22]}};
  function spread(counts) {   // reparte los colores mezclados, siempre en el mismo orden
    var out = [], left = counts.slice(), rnd = rng(42);
    var n = left.reduce(function (a, b) { return a + b; }, 0);
    while (n > 0) {
      var pick = rnd() * n, a = 0;
      while (pick >= left[a]) { pick -= left[a]; a++; }
      out.push(a); left[a]--; n--;
    }
    return out;
  }
  // Las demás preguntas no vienen en el formulario: llevan ejemplo inventado.
  function exampleState() {
    var st = emptyState(); st.demo = true;
    st.ages = FORM.ages.concat([0]);   // quienes tienen 30 o más no están en esos formularios
    Object.keys(FORM.links).forEach(function (k) { st.links[k] = spread(FORM.links[k]); });
    ['whatsapp', 'correo', 'instagram', 'llamada'].forEach(function (k, j) {
      st.links[k] = spread([[40, 28, 9, 7], [6, 10, 12, 14], [52, 30, 8, 5], [3, 4, 6, 9]][j]);
    });
    var EX = {
      salud: 'Manejo de la ansiedad|Dormir mejor|Estrés por estudios|Autoestima|Meditación|Emociones|Poner límites|Pedir ayuda|Duelo|Soledad',
      voluntariado: 'Apoyo escolar|Limpieza de plazas|Visitar a mayores|Rescate animal|Centros de alumnos|Ollas comunes|Cabildos juveniles|Colectas|Huertos|Liderazgo',
      recreacion: 'Más tocatas|Cine al aire libre|Skatepark|Torneo de fútbol|Juegos de mesa|Baile K-pop|Ferias|Picnic|Gaming|Karaoke',
      educacion: 'Preu gratuito|Inglés|Programación|Oratoria|Orientación vocacional|Becas|Fotografía|Armar mi CV|Arte|Primeros auxilios',
      independiente: 'Finanzas personales|Primer trabajo|Arrendar|Cocinar|Trámites|Organizar el tiempo|Impuestos|Vivir solo|Licencia de conducir|Ahorro',
      ambiente: 'Reciclaje|Huertos urbanos|Compostaje|Limpieza del río|Plantar árboles|Bicicleta|Ropa usada|Cuidar el agua|Energía solar|Reparar cosas',
      recomendaciones: 'Serigrafía|Más tocatas|Clases de skate|Fotografía|Feria de emprendedores|Yoga al aire libre|Club de lectura|Taller de cocina|Baile K-pop|Cine al aire libre|Cerámica|Freestyle|Torneo de fútbol|Bordado|Programación|Stand up|Teatro|Fanzines'
    };
    NOTE_KEYS.forEach(function (k) {
      EX[k].split('|').forEach(function (text) {
        var v = AGE_IX.map(function () { return Math.floor(Math.random() * Math.random() * 7); });
        st.notes[k].push({ age: (Math.random() * 4) | 0, text: text, votes: v });
      });
    });
    return st;
  }

  var state = emptyState(), real = null, hadSaved = false;
  try {
    var saved = JSON.parse(localStorage.getItem(STORE));
    if (saved && saved.ages && saved.links && !saved.demo) {
      KEYS.forEach(function (k) { if (!saved.links[k]) saved.links[k] = []; });
      if (!saved.notes || Array.isArray(saved.notes)) saved.notes = { recomendaciones: saved.notes || [] };
      NOTE_KEYS.forEach(function (k) { if (!saved.notes[k]) saved.notes[k] = []; saved.notes[k].forEach(function (n) { if (!n.votes) n.votes = zeros(); }); });
      state = saved; hadSaved = true;
    }
  } catch (e) {}
  function total() { return state.ages.reduce(function (a, b) { return a + b; }, 0); }
  if (IS_LIVE) state = emptyState();
  else if (!hadSaved || (total() === 0 && !state.started)) state = exampleState();
  function save() { if (state.demo || IS_LIVE) return; try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {} }

  var me = { age: null, picks: {}, notes: [], votes: [] };   // picks[key] = posición de su punto en state.links[key]
  var board = document.getElementById('board');
  var meEl = document.getElementById('me');
  var statusEl = document.getElementById('status');

  /* ---------- Ideas: se suman, se votan y nunca se borran ---------- */
  var IDEAS = 'recomendaciones', panelOrder = null, freshIdea = -1, bumped = -1;
  function totalVotes(n) { return n.votes.reduce(function (a, b) { return a + b; }, 0); }
  function liveNote() { meEl.innerHTML = '<strong>Responde desde tu celular: tus puntos caen aquí solos.</strong>'; }
  function addIdea(input) {
    if (IS_LIVE) { liveNote(); return; }
    var text = input.value.trim();
    if (me.age === null) { meEl.innerHTML = '<strong>Primero toca tu edad en la primera columna.</strong>'; return; }
    if (!text) return;
    var arr = state.notes[IDEAS];
    arr.push({ age: me.age, text: text, votes: zeros() });
    me.notes.push([IDEAS, arr.length - 1]);
    freshIdea = arr.length - 1;
    if (panelOrder) panelOrder.unshift(freshIdea);   // en el panel, la idea nueva aparece primero
    input.value = '';
    save(); render();
  }
  function vote(ix) {
    if (IS_LIVE) { liveNote(); return; }
    if (me.age === null) {
      meEl.innerHTML = '<strong>Primero toca tu edad en la primera columna.</strong>';
      panelHint.textContent = 'Para votar, primero toca tu edad en la primera columna.';

  }

  function leaveDemo() {}
  function pickAge(i) {

  function toggle(key) {

  function dataFor(id) {

  }

      st2.btn.setAttribute('aria-pressed', String(mine));

  /* ---------- Dibujo ---------- */
  var SPEED = reduce ? 0.35 : 1;
  function rowsOf(R, b) {   // filas de abajo hacia arriba, cada una con sus posiciones del centro hacia afuera
    var rows = [];
    for (var k = 0; k < 400; k++) {
      var y = (R - b) - k * b * 1.76;
      if (y < -(R - b)) break;
      var lim = (R - b) * (R - b) - y * y, half = lim > 0 ? Math.sqrt(lim) : 0, off = k % 2 ? b * 1.02 : 0, row = [];
      for (var x = off; x <= half + 0.01; x += b * 2.04) { row.push(x); if (x > 0) row.push(-x); }
      row.sort(function (p, q) { return Math.abs(p) - Math.abs(q); });
      if (row.length) rows.push({ y: y, xs: row });
    }
    return rows;
  }
  // groups: cantidad de puntos por color, del más numeroso al menos numeroso.
  // Llena fila por fila sin dejar huecos: cada fila de izquierda a derecha, y el color siguiente
  // continúa justo donde terminó el anterior. Solo la fila de más arriba, si queda incompleta, va centrada.
  function bands(R, b, groups) {
    var total = groups.reduce(function (x, y) { return x + y; }, 0);
    for (var tries = 0; tries < 40; tries++, b *= 0.95) {
      var rows = rowsOf(R, b), out = [], left = total;
      for (var ri = 0; ri < rows.length && left > 0; ri++) {
        var xs = rows[ri].xs, take = Math.min(left, xs.length);
        var pick = xs.slice(0, take).sort(function (p, q) { return p - q; });   // del centro hacia afuera, y luego de izquierda a derecha
        for (var j = 0; j < take; j++) out.push({ x: pick[j], y: rows[ri].y });
        left -= take;
      }
      if (left === 0) return { pos: out, b: b };
    }
    return { pos: out, b: b };
  }

  function toggleSort(id) {
    var c = circles[id];
    c.pendingFall = 0;
    if (c.mode === 'falling' || c.mode === 'pile') { c.mode = 'rising'; c.riseStart = performance.now(); }
    else c.pendingFall = performance.now();   // confeti → cae
  }

  // Cada círculo es una esfera de vidrio: el confeti va pegado por dentro y gira,
  // con las piezas de atrás más tenues y las de los bordes vistas de canto.
  // Una pieza nueva aparece con ¡pop!: crece con rebote y suelta un anillo con chispas.
  function drawCircle(id, now) {
    if (circles[id].kind === 'inf') return drawInf(id, now);
    var c = circles[id], ctx = c.canvas.getContext('2d'), arr = dataFor(id), r = 188, sec = now / 1000;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, 400, 400);
    ctx.translate(200, 200);

    // Posición de una pieza pegada a la esfera en un instante dado (el confeti gira con el tiempo).
    var dir = c.seed % 2 ? 1 : -1, tilt = 0.28, ct = Math.cos(tilt), st = Math.sin(tilt);
    function onSphere(i, t) {
      var rot = c.seed * 1.7 + t * 0.32 * SPEED * dir, cr = Math.cos(rot), sr = Math.sin(rot);
      var rnd = rng(c.seed * 7919 + i * 104729 + 13);
      var uy = rnd() * 2 - 1, th = rnd() * Math.PI * 2, sxy = Math.sqrt(1 - uy * uy);
      var ux = sxy * Math.cos(th), uz = sxy * Math.sin(th);
      var x1 = ux * cr + uz * sr, z1 = -ux * sr + uz * cr;
      var y2 = uy * ct - z1 * st, z2 = uy * st + z1 * ct;
      return { x: r * 0.9 * x1, y: r * 0.9 * y2, nx: x1, ny: y2, nz: z2 };
    }
    var size = r * 0.088 * Math.max(0.42, Math.min(1, Math.sqrt(45 / Math.max(arr.length, 1)))), d = drops[id], pts = [], fresh = null, i, q;
    // Capas limpias: el color con más puntos abajo y el de menos arriba, cada color en sus propias filas.
    var n = arr.length, R = r * 0.92, bb = Math.min(16, R * Math.sqrt(0.6 / Math.max(n, 1)));
    var counts = zeros(); for (i = 0; i < n; i++) counts[arr[i]]++;
    var rank = AGE_IX.slice().sort(function (x, y) { return counts[y] - counts[x] || x - y; });
    var rankOf = []; rank.forEach(function (a, j) { rankOf[a] = j; });
    var lay = bands(R, bb, rank.map(function (a) { return counts[a]; }));
    var targets = lay.pos; bb = lay.b;
    if (!c.mode) c.mode = 'confetti';

    // Empieza a caer: el confeti se detiene y cada pieza cae casi en línea recta a su lugar en su capa.
    if (c.mode === 'confetti' && c.pendingFall && now >= c.pendingFall) {
      c.pendingFall = 0; c.mode = 'falling'; c.fallStart = now; c.fallN = -1;
    }
    if ((c.mode === 'falling' || c.mode === 'pile') && c.fallN !== n) {
      // Dentro de cada capa, a cada pieza le toca el lugar que queda justo bajo ella.
      var start = [], slotOf = [], at = 0, t0 = c.fallStart / 1000;
      for (i = 0; i < n; i++) start.push(c.p0 && c.p0[i] && c.fallN === -2 ? c.p0[i] : onSphere(i, t0));
      rank.forEach(function (a) {
        var mine = []; for (var k = 0; k < n; k++) if (arr[k] === a) mine.push(k);
        var spots = []; for (k = 0; k < mine.length; k++) spots.push(at + k);
        mine.sort(function (x, y) { return start[x].x - start[y].x; });
        spots.sort(function (x, y) { return (targets[x] || { x: 0 }).x - (targets[y] || { x: 0 }).x; });
        mine.forEach(function (idx, k) { slotOf[idx] = spots[k]; });
        at += mine.length;
      });
      c.p0 = start; c.slot = slotOf; c.fallN = n;
    }
    var T = c.mode === 'falling' ? (now - c.fallStart) / 1000 : 0, G = 2600, busy = false, rise = 0;
    if (c.mode === 'rising') {
      rise = Math.min(1, (now - c.riseStart) / 900);
      if (rise >= 1 || !c.slot) { c.mode = 'confetti'; c.slot = null; c.p0 = null; c.fallN = -1; rise = 0; }
    }

    for (i = 0; i < n; i++) {
      q = onSphere(i, sec);
      q.color = AGES[arr[i]].color; q.m = 0;
      var tg = c.slot ? (targets[c.slot[i]] || { x: 0, y: 0 }) : null;

        q.x = p0.x; q.y = p0.y; q.nx = p0.nx; q.ny = p0.ny; q.nz = p0.nz;   // quieta hasta que la sueltan
        if (tl > 0) {

          if (dy > 0) { Tf = Math.sqrt(2 * dy / G); v0 = 0; }
          else { Tf = 0.38; v0 = (dy - 0.5 * G * Tf * Tf) / Tf; }
          if (tl < Tf) {
            var u = tl / Tf;
            q.x = p0.x + (tg.x - p0.x) * (1 - (1 - u) * (1 - u));   // se corre un poco de lado mientras cae
            q.y = p0.y + v0 * tl + 0.5 * G * tl * tl;               // gravedad: cada vez más rápido
            q.m = Math.min(1, u * 1.6); busy = true;

            q.y = tg.y - bb * 0.55 * Math.abs(Math.sin(tb * 16)) * e2;   // rebote que se apaga

      } else if (c.mode === 'pile' && tg) {
        q.x = tg.x; q.y = tg.y; q.m = 1;   // en reposo: quietas en el fondo
      } else if (c.mode === 'rising' && tg) {
        var e = rise < 0.5 ? 4 * rise * rise * rise : 1 - Math.pow(-2 * rise + 2, 3) / 2;
        q.m = 1 - e;
        q.x = tg.x + (q.x - tg.x) * e; q.y = tg.y + (q.y - tg.y) * e;

    }
    if (c.mode === 'falling' && !busy) c.mode = 'pile';
    function piece(q, k, alpha) {
      var m = q.m, rx = size * k * Math.max(Math.abs(q.nz), 0.16), ry = size * k;
      ctx.globalAlpha = (alpha + (0.95 - alpha) * m) * (q.fade == null ? 1 : q.fade);
      var gr = q.grow == null ? 1 : q.grow;
      ctx.fillStyle = q.color;
      ctx.beginPath();
      var ex = (rx + (bb * 0.95 - rx) * m) * gr, ey = (ry + (bb * 0.95 - ry) * m) * gr, ang = Math.atan2(q.ny, q.nx) * (1 - m);
      ctx.ellipse(q.x, q.y + ey * (1 - (q.sy || 1)), ex * (q.sx || 1), ey * (q.sy || 1), ang, 0, Math.PI * 2);
      ctx.fill();

    for (i = 0; i < pts.length; i++) if (pts[i].nz < 0 && pts[i].m < 0.5) piece(pts[i], 0.9, 0.38);
    // vidrio: más denso hacia el borde, para dar volumen
    ctx.globalAlpha = 1;
    var g = ctx.createRadialGradient(-r * 0.3, -r * 0.35, r * 0.05, 0, 0, r);
    g.addColorStop(0, 'rgba(255,255,255,0.55)');
    g.addColorStop(0.55, 'rgba(255,253,248,0.18)');

  var pulseOn = true, liveSeen = false;
  function pulseIf(el, holder, n) {   // el contador late solo cuando sube (y no en la primera carga)
    if (pulseOn && holder.prevN != null && n > holder.prevN && el) { el.classList.remove('pulse'); void el.offsetWidth; el.classList.add('pulse'); }
    holder.prevN = n;
  }
  function applyLive(next) {
    var now = performance.now();
    AGES.forEach(function (a, i) { if (next.ages[i] > state.ages[i]) drops['age' + i] = { index: next.ages[i] - 1, start: now }; });
    KEYS.forEach(function (k) {
      var nl = next.links[k].length;
      if (nl > state.links[k].length) drops[k] = { index: nl - 1, start: now };   // el punto nuevo cae con ¡pop!
      if (stacks[k] && stacks[k].parts.length > nl) stacks[k].parts.length = nl;
    });
    if (next.notes[IDEAS].length > state.notes[IDEAS].length) freshIdea = next.notes[IDEAS].length - 1;
    var first = !liveSeen; liveSeen = true; pulseOn = !first; state = next; render(); pulseOn = true;
  }
  function normalizeState(raw) {   // el resumen de Apps Script ya viene con la forma de la pizarra
    var st = emptyState();
    (raw.ages || []).forEach(function (v, i) { if (i < AGES.length) st.ages[i] = v | 0; });
    KEYS.forEach(function (k) { st.links[k] = ((raw.links || {})[k] || []).map(function (v) { return v | 0; }); });
    st.notes[IDEAS] = (((raw.notes || {})[IDEAS]) || []).map(function (n) {
      return { age: n.age | 0, text: String(n.text), votes: AGE_IX.map(function (i) { return (n.votes || [])[i] | 0; }) };
    });
    return st;
  }
  function addBase(next) {   // suma, debajo de lo nuevo, las respuestas reales de los formularios anteriores (edad, vínculo y temas)
    var st = emptyState();
    st.ages = AGES.map(function (a, i) { return (FORM.ages[i] || 0) + (next.ages[i] || 0); });
    KEYS.forEach(function (k) { st.links[k] = (FORM.links[k] ? spread(FORM.links[k]) : []).concat(next.links[k] || []); });
    st.notes = next.notes;
    return st;
  }
  var liveSig = '';
  function refresh() {
    var url = LIVE.csv + (LIVE.csv.indexOf('?') < 0 ? '?' : '&') + 't=' + Date.now();
    fetch(url, { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); }).then(function (text) {
      var next = text.charAt(0) === '{' ? normalizeState(JSON.parse(text)) : stateFromRows(parseCsv(text));
      if (LIVE.base) next = addBase(next);
      var sig = JSON.stringify(next);
      if (sig !== liveSig) { liveSig = sig; applyLive(next); }
      var d = new Date(), p2 = function (v) { return (v < 10 ? '0' : '') + v; };
      statusEl.textContent = 'En vivo desde la planilla · ' + total() + (total() === 1 ? ' persona' : ' personas') +
        ' · actualizado ' + p2(d.getHours()) + ':' + p2(d.getMinutes()) + ':' + p2(d.getSeconds());
    }).catch(function () {
      statusEl.textContent = 'Sin conexión con la planilla. Se muestra lo último que llegó y sigue intentando.';
    });
  }

  if (state.demo) statusEl.textContent = demoMsg;
  render();
  if (IS_LIVE) { statusEl.textContent = 'Conectando con la planilla…'; refresh(); setInterval(refresh, LIVE.every); }
})();
</script>
